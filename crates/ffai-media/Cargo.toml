[package]
name = "ffai-media"
description = "FFai media ingest/egress — demux, decode, resample (rff-backed)"
# rusty_jpeg 0.1 -> 0.2 picks up the progressive-JPEG fix. A dependency
# change with no API change, so a patch bump -- but a load-bearing one:
# 0.6.1 cannot decode 35 of OmniDocBench's 236 pages.
version = "0.6.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["audio", "wav", "resample", "decoding", "media"]
categories = ["multimedia::audio", "multimedia::encoding"]

[dependencies]
ffai-core = { workspace = true }
hound = { workspace = true }

# CODECS COME FROM HOME (Principle 7) — and now from CRATES.IO.
#
# `rusty_jpeg` and `rusty_png` are our own decoders, published as standalone
# crates. Depending on them directly rather than through the `rff-*` git
# workspace is what makes every FFai crate downstream of this one
# PUBLISHABLE again: `cargo publish` refuses a git dependency outright ("all
# dependencies must have a version requirement specified when publishing"),
# and that single constraint had blocked the whole chain.
#
# The registry seam (`rff_codec::CodecRegistry`) is still the right home for
# DEMUXERS and video codecs, where rff provides something nothing else does.
# For a still-image decoder it bought an indirection and cost publication.
rusty_png = "0.3"
rusty_jpeg = "0.3"
# VIDEO INGEST, from crates.io rather than the git workspace.
#
# `sample_frames` was a stub waiting on "the rff backend". The backend is
# PUBLISHED: rff-core, rff-format, rff-format-mp4 and rff-codec-h264 (pure
# Rust via rusty_h264, decoder bit-exact against Cisco openh264). Depending on
# the RELEASED crates keeps every FFai crate downstream publishable, which the
# git dependency in the workspace root does not — that constraint cost this
# project a publication chain once already.
rff-core = "0.1"
rff-format = "0.1"
rff-format-mp4 = "0.1"
rff-format-mkv = "0.1"
rff-format-avi = "0.1"
rff-format-ts = "0.1"
rff-codec = "0.1"
rusty_h264 = "0.8"

# THE PUBLISHING CONSTRAINT IS RESOLVED, and the note stays because it cost
# real time to establish.
#
# Until these crates existed the rule here was: rff is a GIT dependency, and
# `cargo publish` refuses one outright —
#
#   error: failed to verify manifest ...
#     all dependencies must have a version requirement specified when publishing.
#
# — so every FFai crate downstream of ffai-media was unpublishable. Pinning a
# fake `version =` alongside the git source publishes but leaves downstream
# users resolving a version that does not exist, which is worse.
#
# `rusty_jpeg` and `rusty_png` ARE those decoders, published standalone. The
# stack is still ours end to end; it now also ships. Where rff provides
# something nothing else does — demuxers, H.264/VP9, video ingest for LIVE —
# the git dependency still has real content and that question returns when
# video lands.

[features]
# Reserved for the rff-* backend where it still adds something a standalone
# decoder cannot: demux and video codecs. Still a distribution question, no
# longer a blocker for still images.
remade-ffmpeg = []

[lints]
workspace = true

[dev-dependencies]
# Upstream png: the ORACLE rusty_png (a fork of it) is tested against.
png = { workspace = true }
