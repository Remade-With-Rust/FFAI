[package]
name = "ffai-models"
description = "FFai model weight management — manifests, cache, licensing surfaced"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["model-weights", "huggingface", "safetensors", "cache", "manifest"]
categories = ["caching", "filesystem"]

[dependencies]
ffai-core = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
# Optional: the Hugging Face downloader.
#
# It is 226 crates — reqwest, hyper, rustls, aws-lc-sys — and a consumer that
# ships its own weights never calls it. `ffai-diana` is exactly that consumer:
# its whole use of this crate is `load_dir`, which reads TOML off disk with
# `std::fs`. Default-on so nothing changes for existing users; turn it off
# with `default-features = false` for size-, weight- and power-constrained
# builds.
hf-hub = { workspace = true, optional = true }
sha2 = { workspace = true }

[features]
default = ["fetch"]
# Download weights from the Hugging Face hub. Without it, manifests still load
# and local files still resolve; only fetching is unavailable, and it fails
# with a message that says so rather than a missing-method error.
fetch = ["dep:hf-hub"]

[lints.rust]
# Mirrors [workspace.lints.rust]; restated because this crate needs its own
# [lints.clippy] table, and `[lints] workspace = true` is all-or-nothing.
unsafe_code = "warn"

# Gate H-15: pedantic + nursery, enforced.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Documentation debt: real, worth doing, not worth blocking on today.
# Revisit 2026-11-15.
missing_errors_doc = "allow"
# `fold` building a String reads more clearly here than the iterator chain
# clippy prefers.
format_collect = "allow"
