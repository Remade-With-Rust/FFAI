[package]
name = "ffai-bench"
description = "FFai's analyzer — one call to compare any engine against world standards, ledger-backed"
# the runner records a clip failure and continues instead of aborting the
# whole corpus, and decode is wrapped so a panicking dependency costs one
# page rather than the run.
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["benchmark", "wer", "profiling", "evaluation", "ai"]
categories = ["development-tools", "science"]

[dependencies]
ffai-core = { workspace = true }
ffai-media = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
sha2 = { workspace = true }
regex = { workspace = true }

[dev-dependencies]
# Only the synthetic-corpus generator examples use these; the library needs
# neither a rasterizer nor a PNG encoder.
fontdue = "0.9"
png = "0.17"
# `suppress_optimizer` only — the rule search reads harvested CSVs. The library
# never parses a CSV and never takes an argument.
clap = { workspace = true }
csv = "1.3"

[lints]
workspace = true
