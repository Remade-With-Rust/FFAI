[package]
name = "ffai-mercury-wasm"
description = "Mercury in the browser — pure-Rust Whisper speech recognition compiled to WebAssembly, no whisper.cpp, no ONNX runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# `pkg/` is wasm-bindgen output, regenerated by the command in the README.
include = ["src/**/*.rs", "README.md", "demo.html"]
keywords = ["wasm", "speech-recognition", "whisper", "webassembly", "asr"]
categories = ["wasm", "multimedia::audio"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ffai-core = { workspace = true }
# `default-features = false` drops `fetch`, and with it hf-hub, whose 1.0
# release calls `reqwest::blocking` — a module that does not exist on wasm32.
# Nothing in a browser can fetch weights through the model cache anyway: the
# caller supplies bytes.
ffai-mercury = { path = "../ffai-mercury", version = "1.0.1", default-features = false }
wasm-bindgen = "=0.2.121"   # pinned to the installed wasm-bindgen-cli; the two must match exactly

# The binary is the only thing entitled to choose an allocator, and a cdylib IS
# the binary here. `ffai-carmenta-wasm` measured this properly and found a real
# defect: rusty_alloc <=1.1.4 never reused a freed segment on wasm32 and grew
# ~750 MB per page. Fixed upstream in 1.1.5/1.1.6, which is what this pins.
# Mercury's allocation pattern is its own question — one long encoder/decoder
# chain rather than many small crops — so `--no-default-features` keeps the
# dlmalloc arm buildable for whoever takes that measurement.
rusty_alloc-api = { version = "=1.1.6", optional = true }

[features]
default = ["rusty-alloc"]
rusty-alloc = ["dep:rusty_alloc-api"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints.rust]
# Mirrors [workspace.lints.rust]; restated because this crate needs its own
# [lints.clippy] table, and `[lints] workspace = true` is all-or-nothing.
unsafe_code = "warn"

# Gate H-15: pedantic + nursery, enforced.
#
# The allows below are documentation and style. The numeric-cast lints that
# matter — truncation, sign loss, wrap — are NOT allowed here: this crate does
# not do the arithmetic, it calls the crate that does.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Documentation debt: revisit 2026-11-15.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
# Counts and indices converted for display or reporting; rounding only.
cast_precision_loss = "allow"
# Style preferences that do not change behaviour.
needless_pass_by_value = "allow"
missing_const_for_fn = "allow"
