[package]
name = "ffai-argus"
description = "Argus — FFai's VLM component: image captioning and video understanding"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["vlm", "image-captioning", "computer-vision", "multimodal", "captioning"]
categories = ["computer-vision", "multimedia::images", "science"]

[dependencies]
ffai-core = { workspace = true }
# Manifest-driven checkpoint resolution, the same seam every other engine uses:
# no engine hardcodes an HF cache path.
# `default-features = false` drops hf-hub (and aws-lc-sys). OEM sidecars ship
# their own weights; they must not inherit fetch just because Argus is linked.
# Not `workspace = true`: cargo forbids overriding default-features on an
# inherited dep.
ffai-models = { path = "../ffai-models", version = "0.6.3", default-features = false }
# The tokenizer is the ENGINE's business now, not just the step-4 test's: the
# assembled prompt has to become ids and the generated ids have to become text.
tokenizers = { workspace = true }
# The tensor spine. All three MUST move in lockstep — mixing candle-core and
# candle-transformers minor versions is a type mismatch, not a warning.
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
# The vision tower's elementwise kernels run across cores; candle's do not
# (its CPU backend parallelises conv2d and nothing else), and that half of a
# SigLIP layer is where the time was. See src/siglip.rs.
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# BACKEND PLAN (Phase 4): mistral.rs — the candle-based inference engine — as
# an optional dependency powering Qwen-VL / LLaVA-class models:
#   mistralrs = { git = "https://github.com/EricLBuehler/mistral.rs", optional = true }
# Deliberately not added in Phase 0: it is a large git dependency every
# contributor would fetch while the feature is still a stub. It lands together
# with the first working describe_image().

[dev-dependencies]
# The SAME allocator the `ffai` binary declares.
#
# Examples are binaries, and a binary with no `#[global_allocator]` uses the
# system one — so every measurement taken from `examples/` was profiling a
# different allocator than production runs. That matters here more than most
# places: a SigLIP/Llama forward allocates a 47 MB score tensor per layer, and
# 47 MB is above the threshold where most allocators stop pooling and go
# straight to the OS. See `examples/alloc_ab.rs`.
rusty_alloc-api = "=1.1.4"

# The step-3 oracle test reads the reference dump's summary.json.
serde_json = { workspace = true }
# Step 6's gate resolves the checkpoint the same way the engine does, so the
# test cannot pass against a model the engine could not have found.
ffai-models = { workspace = true }
# The README's example is compiled (examples/quickstart.rs) so its code is
# type-checked against the real API rather than against memory. Decoding an
# image file is the CALLER's job — the engine takes an already-decoded
# `ImageBuffer` — so this is a dev-dependency, not a dependency.
ffai-media = { workspace = true }

[features]
# Weight download. Off by default so an OEM binary that enables Argus does
# not pull hf-hub / aws-lc-sys. Enable `fetch` when you want hub download.
fetch = ["ffai-models/fetch"]
# Will enable the mistral.rs backend once wired (Phase 4).
mistralrs-backend = []

[lints.rust]
# Mirrors [workspace.lints.rust]; restated because this crate needs its own
# [lints.clippy] table, and `[lints] workspace = true` is all-or-nothing.
unsafe_code = "warn"

# Gate H-15: pedantic + nursery, enforced.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# This crate WAS clean under both groups when it was a 66-line stub. It now
# carries a resampling kernel, a tile geometry calculator and a decode loop,
# and the allows below are the ones numeric code inherently needs — the same
# set `ffai-bench` documents for the same reason.
#
# Each is scoped and read rather than waved through:
#
# * the casts are indices and image dimensions, bounded by an image this
#   process just decoded — a 2048x2048 tile grid is nowhere near f32's 24-bit
#   integer range, let alone usize's;
# * `suboptimal_flops` fires on the resampler's accumulate loop, where the
#   multiply-add order is chosen to match the reference's, not the FPU's
#   preference. Fusing it would change the result and break the oracle gate
#   that exists to catch exactly that.
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
suboptimal_flops = "allow"
# Documentation debt on the internal loaders; the public gates are documented.
missing_errors_doc = "allow"
