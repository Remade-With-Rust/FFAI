# Fuzz harnesses for ffai-mercury's untrusted-input entry points (gate H-26).
#
# NOT a workspace member on purpose: cargo-fuzz builds with its own nightly
# toolchain and sanitizer flags, and letting it inherit the workspace profile
# (overflow-checks, lto, codegen-units=1) would fight libFuzzer's instrumentation.
[package]
name = "ffai-mercury-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ffai-mercury]
path = ".."

[workspace]
members = ["."]

# Fuzzing wants the checks ON: a panic found by the fuzzer is a DoS finding, and an
# overflow found here is a bug report rather than silent wraparound.
[profile.release]
debug = 1
overflow-checks = true
debug-assertions = true

[[bin]]
name = "onnx_parse"
path = "fuzz_targets/onnx_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "lexicon_parse"
path = "fuzz_targets/lexicon_parse.rs"
test = false
doc = false
bench = false
