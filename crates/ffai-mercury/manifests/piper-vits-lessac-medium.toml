# The M-T2 voice for `piper-candle`: en_US-lessac-medium, fetched as the
# files piper itself ships and read directly (docs/mercury-tts-mission.md).
#
# NO CONVERSION STEP. Mercury reads the `.onnx` with its own pure-Rust ONNX
# reader (`tts::onnx`), so this manifest points straight at the upstream
# voice repo — public and ungated, per principle 4. The Python converter in
# corpora/refs/ remains as the ORACLE the Rust reader is gated against
# (examples/onnx_vs_safetensors.rs: 350 tensors byte-identical), not as a
# step anyone has to run.
#
#   ffai models --fetch piper-vits-lessac-medium
#
# VOICE LICENCE: the MODEL_CARD below is fetched with the weights so the
# voice's own terms land in the cache beside it. The piper-voices repo states
# voices are intended for personal use and text-to-speech research; check the
# card before commercial redistribution. The licence field here is the
# VOICE's, not FFai's.
name = "piper-vits-lessac-medium"
task = "tts"
description = "piper en_US-lessac-medium (VITS, 15.7M params, 22.05 kHz) — read directly from ONNX"
license = "See MODEL_CARD (rhasspy/piper-voices; blizzard_lessac dataset)"
hf_repo = "rhasspy/piper-voices"

