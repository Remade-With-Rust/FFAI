[package]
name = "ffai-mercury"
description = "Mercury — FFai's voice component: pure-Rust ASR (Whisper/WhisperX-class) and TTS (VITS/piper-class, deterministic)"
# Decoupled from the workspace version so Mercury can ship ahead of the rest.
# 0.7.0 rather than 0.6.2 because synthesis output is no longer bit-identical
# to 0.6.1 -- the API is purely additive, but this crate advertises byte-stable
# determinism, so a changed waveform is a compatibility break for anyone who
# pinned bytes. Its dependencies stay at the published 0.6.1.
version = "0.7.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["speech-recognition", "text-to-speech", "whisper", "tts", "asr"]
categories = ["multimedia::audio", "science", "accessibility"]

[dependencies]
ffai-core = { workspace = true }
ffai-models = { path = "../ffai-models", version = "0.6.1", default-features = false }  # not `workspace = true`: cargo forbids overriding default-features on an inherited dep
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
tokenizers = { workspace = true }
rustfft = { workspace = true }
rayon = "1"
half = "2"
serde_json = { workspace = true }

[dev-dependencies]
# Gate H-28: property tests for the advertised invariants (tests/properties.rs).
proptest = "1"
ffai-models = { workspace = true }

[features]
# Weight downloading, ON by default because the README documents it: `cargo add
# ffai-mercury` + `WhisperCandle::new()` fetches on first use.
#
# Turning it OFF is what a security-conscious embedder wants, and it is a large
# lever rather than a tidy-up. `fetch` pulls hf-hub -> reqwest -> rustls ->
# aws-lc-rs -> aws-lc-sys, a C crypto library, and with it roughly 180 crates:
# ffai-mercury resolves 320 dependencies with it and about 140 without, which is
# what ffai-diana already measures because it opted out first.
#
# Ship your own weights and build with --no-default-features to get a graph with
# no TLS stack and no C crypto at all. Manifests still load and local files still
# resolve; only fetching is unavailable, and it says so.
default = ["fetch"]
fetch = ["ffai-models/fetch"]
cuda = ["ffai-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
metal = ["ffai-core/metal", "candle-nn/metal", "candle-transformers/metal"]

[lints.rust]
# `cfg(kani)` is set by the Kani verifier, not by cargo, so --check-cfg does not
# know it exists and warns on src/proofs.rs. Declare it rather than silencing
# unexpected_cfgs wholesale - the lint is worth keeping for genuine typos.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
# Mirrors [workspace.lints.rust]. Restated because this crate needs its own
# [lints.clippy] table below, and `[lints] workspace = true` is all-or-nothing:
# it cannot be combined with local lint tables. If the workspace rule changes,
# change it here too.
unsafe_code = "warn"

# Crate-level exceptions, each a deliberate decision rather than a shortcut.
# Gate H-15: the policy is "clippy::all denied, exceptions justified in writing".
[lints.clippy]
# `.max(a).min(b)` and `clamp` differ on NaN, and these paths carry audio
# samples where NaN is reachable. Rewriting them would change behaviour.
manual_clamp = "allow"
# Kernel constants are transcribed from the reference implementation. Rounding
# them to "nicer" literals changes the bits, and this crate advertises
# byte-stable output.
approx_constant = "allow"
excessive_precision = "allow"
# The SIMD kernels take the arguments the arithmetic needs; splitting them into
# a struct adds an indirection to the hottest loops in the crate.
too_many_arguments = "allow"
type_complexity = "allow"
# Index-based loops in the kernels are deliberate: the iterator form changes
# what the autovectoriser produces, and these loops are the measured hot path.
needless_range_loop = "allow"
# Two arms that look identical today document two distinct cases.
if_same_then_else = "allow"

[dev-dependencies.ffai-bench]
workspace = true

[dev-dependencies.ffai-media]
workspace = true
