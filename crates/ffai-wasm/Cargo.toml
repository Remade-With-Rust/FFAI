[package]
name = "ffai-wasm"
description = "Diana in the browser — YOLO26 object detection compiled to WebAssembly, pure Rust, no ONNX runtime"
version = "0.1.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# `pkg/` is wasm-bindgen output, regenerated by the command in the README.
include = ["src/**/*.rs", "README.md", "demo.html"]
keywords = ["wasm", "object-detection", "yolo", "webassembly", "computer-vision"]
categories = ["wasm", "computer-vision"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ffai-core = { workspace = true }
ffai-diana = { workspace = true }
wasm-bindgen = "=0.2.121"   # pinned to the installed wasm-bindgen-cli; the two must match exactly

# The binary is the only thing entitled to choose an allocator, and a cdylib IS
# the binary here. On wasm32 the Rust default is dlmalloc; `rusty_alloc` ships
# `prim/wasm.rs` and has already made a measured wasm-specific choice (arena
# pre-reservation is disabled there, because wasm `memory.grow` is never
# returned to the host). Whether it beats dlmalloc on THIS workload is a
# measurement we can now run, which is the point of having a cdylib at all.
rusty_alloc-api = { version = "=1.1.6", optional = true }

[features]
# `rusty_alloc` is the default; `--no-default-features` leaves the target's own
# allocator in place, which on wasm32 is dlmalloc. Two modules that differ in
# exactly one `#[global_allocator]` line and nothing else is what makes the
# comparison a measurement of the allocator rather than of two builds.
default = ["rusty-alloc"]
rusty-alloc = ["dep:rusty_alloc-api"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[lints.rust]
# Mirrors [workspace.lints.rust]; restated because this crate needs its own
# [lints.clippy] table, and `[lints] workspace = true` is all-or-nothing.
unsafe_code = "warn"

# Gate H-15: pedantic + nursery, enforced.
#
# The allows below are documentation and style. The numeric-cast lints that
# matter - truncation, sign loss, wrap - are NOT allowed here: this crate does
# not do the arithmetic, it calls the crates that do, and those carry the
# policy that found this audit's defects.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Documentation debt: revisit 2026-11-15.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
# Counts and indices converted for display or reporting; rounding only.
cast_precision_loss = "allow"
# Style preferences that do not change behaviour.
needless_pass_by_value = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
similar_names = "allow"
option_if_let_else = "allow"
single_match_else = "allow"
unnested_or_patterns = "allow"
equatable_if_let = "allow"
manual_let_else = "allow"
default_trait_access = "allow"
missing_const_for_fn = "allow"
unnecessary_wraps = "allow"
format_push_string = "allow"
significant_drop_tightening = "allow"
redundant_closure_for_method_calls = "allow"
