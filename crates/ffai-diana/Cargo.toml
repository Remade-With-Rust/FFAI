[package]
name = "ffai-diana"
description = "Diana — FFai's detection component (YOLO26 on candle, pure Rust)"
# 0.7.3 is a documentation-only republish: README restructured to the shared
# Remade With Rust page layout. No code, API or output change.
version = "0.7.6"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# Ship the library, its README and the one example a USER runs.
#
# The other 34 examples are this campaign's measurement probes — roofline
# counters, A/B harnesses, allocator experiments — and every one of them
# expects `models/` and `corpora/` from the repository. Packaging them would
# put 34 files that cannot run in front of anyone who opens the crate.
# `quickstart.rs` is kept precisely because it is the README's code, compiled.
include = [
    "src/**/*.rs",
    "README.md",
    "examples/quickstart.rs",
]
keywords = ["object-detection", "yolo", "computer-vision", "candle", "edge"]
categories = ["computer-vision", "multimedia::images", "science"]

[dependencies]
ffai-core = { workspace = true }
# `default-features = false` drops hf-hub and with it 226 of 308 transitive
# crates — reqwest, hyper, rustls, aws-lc-sys. Diana's entire use of this
# crate is `load_dir`, which reads TOML off disk; it has never downloaded
# anything. Weights are supplied by the caller, which is also what the AGPL
# position requires.
# Declared directly rather than inherited: `default-features = false` cannot
# override a workspace dependency's defaults, and setting it at the workspace
# level would silently strip `fetch` from every other crate that expects it.
ffai-models = { path = "../ffai-models", version = "0.6.4", default-features = false }
candle-core = { workspace = true }
candle-nn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# wasm32 needs getrandom's browser backend selected explicitly; it is pulled
# transitively by candle and cannot configure itself. Costs nothing on native.
# rayon is NOT a wasm dependency. `wasm32-unknown-unknown` has no threads to
# put in a pool, and `crate::par` supplies the identical serial methods there —
# so dropping it entirely is what PROVES the shim is complete: any call site
# that still reaches for a parallel iterator fails to build instead of
# panicking in a browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# Experiment only (examples/alloc_ab.rs): 58,634 page faults per image say the
# system allocator is re-faulting nearly every byte it hands back. This tests
# whether an allocator that keeps pages mapped removes that cost, BEFORE any
# decision about shipping one.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false }
# The pure-Rust remake of the above. Evaluating it is the whole point of
# `examples/alloc_ab.rs`: mimalloc is a C library, and it is also by a wide
# margin the largest single effect in the Diana latency campaign (1.64x), so
# it is simultaneously the dependency we most want to drop and the one that
# costs the most to drop wrongly.
rusty_alloc-api = "=1.1.6"
# The core, for `alloc::collect` — the reclaim `examples/scaling.rs` drives.
# `rusty_alloc-api` deliberately exposes collect only per-`Heap`.
rusty_alloc = "=1.1.6"
ffai-media = { path = "../ffai-media" }
ffai-bench = { path = "../ffai-bench" }

[lints.rust]
# Mirrors [workspace.lints.rust]; restated because this crate needs its own
# [lints.clippy] table, and `[lints] workspace = true` is all-or-nothing.
unsafe_code = "warn"

# Gate H-15: pedantic + nursery, enforced.
#
# !!! DEFERRED WORK, NOT A CLEAN BILL OF HEALTH !!!
#
# The three cast lints below are allowed WHOLESALE, which is NOT how the other
# ten crates were done. There, every truncation/sign-loss/wrap cast on an
# untrusted path was read individually and allowed only with a named guard, and
# that review found six real defects - an ONNX field-number aliasing bug, a WAV
# shift by an unvalidated header field, three unchecked frame allocations, and a
# zero-sample-rate divide that saturated into Vec::with_capacity(usize::MAX).
#
# This crate has ~38 such casts, and it parses IMAGES and DOCUMENTS - i.e.
# genuinely untrusted bytes, the same surface those defects were found on. That
# review is DEFERRED at the user's instruction (2026-08-15), not completed.
#
# So: the stylistic hygiene is done and the gate is on, but treat these three
# allows as an open TODO carrying real risk, not as a verdict. Removing them and
# working the list is the next piece of security work on this crate.
# Tracked in the audit memo and in ffai-mercury's plan file.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# --- DEFERRED: unreviewed casts on an untrusted-input path (see above) ---
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Rounding only; cannot alias one value onto another.
cast_precision_loss = "allow"
# --- documentation debt: revisit 2026-11-15 ---
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
# --- style in vision/DSP code ---
suboptimal_flops = "allow"
many_single_char_names = "allow"
similar_names = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
needless_range_loop = "allow"
option_if_let_else = "allow"
single_match_else = "allow"
unnested_or_patterns = "allow"
equatable_if_let = "allow"
manual_let_else = "allow"
default_trait_access = "allow"
missing_const_for_fn = "allow"
unnecessary_wraps = "allow"
format_push_string = "allow"
significant_drop_tightening = "allow"
redundant_closure_for_method_calls = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
if_not_else = "allow"
match_same_arms = "allow"
unreadable_literal = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
float_cmp = "allow"
cast_ptr_alignment = "allow"
ref_as_ptr = "allow"
ptr_as_ptr = "allow"
borrow_as_ptr = "allow"
inline_always = "allow"
unused_self = "allow"
redundant_clone = "allow"
or_fun_call = "allow"
manual_midpoint = "allow"
format_collect = "allow"
derive_partial_eq_without_eq = "allow"
literal_string_with_formatting_args = "allow"
assigning_clones = "allow"
needless_continue = "allow"
needless_for_each = "allow"
while_float = "allow"
nonminimal_bool = "allow"
needless_collect = "allow"
imprecise_flops = "allow"
manual_is_multiple_of = "allow"
needless_borrow = "allow"
no_effect_underscore_binding = "allow"
too_many_arguments = "allow"
wildcard_imports = "allow"
bool_to_int_with_if = "allow"
clone_on_copy = "allow"
int_plus_one = "allow"
match_wildcard_for_single_variants = "allow"
question_mark = "allow"
type_complexity = "allow"

[features]
# DIAGNOSTIC, not a shipping default. Routes candle's matmul to Intel MKL.
#
# 52% of the pipeline is candle's GEMM running at ~50% of this box's peak, and
# beating it by hand is refuted four times. This answers the question that
# decides whether a pure-Rust GEMM effort is worth funding at all: if MKL
# closes the gap to ORT, the matmul IS the gap; if it does not, something else
# is, and a GEMM project would have been months spent on the wrong term.
#
# It is a C library, which is exactly what FFai exists not to depend on — so
# this is opt-in, off by default, and the number it produces is evidence about
# where to aim, not a result to ship.
mkl = ["candle-core/mkl", "candle-nn/mkl"]
# Emit per-decision telemetry for the Prometheus harvester (Stage 1).
# OFF by default and zero-cost when off: the hooks compile to empty bodies
# the optimizer deletes. Additive only — an instrumented engine must produce
# byte-identical output, which the oracle and determinism tests enforce.
prometheus-telemetry = []
# Allocator arms for `examples/alloc_ab.rs`. Selecting one changes exactly one
# type in one `#[global_allocator]` line and nothing else, so the two binaries
# are otherwise identical — which is what makes the A/B a measurement of the
# allocator rather than of two builds.
alloc-rusty = []
alloc-sys = []
