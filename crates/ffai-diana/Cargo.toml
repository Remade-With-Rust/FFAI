[package]
name = "ffai-diana"
description = "Diana — FFai's detection component (YOLO26 on candle, pure Rust)"
version = "0.7.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
# Ship the library, its README and the one example a USER runs.
#
# The other 34 examples are this campaign's measurement probes — roofline
# counters, A/B harnesses, allocator experiments — and every one of them
# expects `models/` and `corpora/` from the repository. Packaging them would
# put 34 files that cannot run in front of anyone who opens the crate.
# `quickstart.rs` is kept precisely because it is the README's code, compiled.
include = [
    "src/**/*.rs",
    "README.md",
    "examples/quickstart.rs",
]
keywords = ["object-detection", "yolo", "computer-vision", "candle", "edge"]
categories = ["computer-vision", "multimedia::images", "science"]

[dependencies]
ffai-core = { workspace = true }
# `default-features = false` drops hf-hub and with it 226 of 308 transitive
# crates — reqwest, hyper, rustls, aws-lc-sys. Diana's entire use of this
# crate is `load_dir`, which reads TOML off disk; it has never downloaded
# anything. Weights are supplied by the caller, which is also what the AGPL
# position requires.
# Declared directly rather than inherited: `default-features = false` cannot
# override a workspace dependency's defaults, and setting it at the workspace
# level would silently strip `fetch` from every other crate that expects it.
ffai-models = { path = "../ffai-models", version = "0.6.1", default-features = false }
candle-core = { workspace = true }
candle-nn = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# wasm32 needs getrandom's browser backend selected explicitly; it is pulled
# transitively by candle and cannot configure itself. Costs nothing on native.
# rayon is NOT a wasm dependency. `wasm32-unknown-unknown` has no threads to
# put in a pool, and `crate::par` supplies the identical serial methods there —
# so dropping it entirely is what PROVES the shim is complete: any call site
# that still reaches for a parallel iterator fails to build instead of
# panicking in a browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# Experiment only (examples/alloc_ab.rs): 58,634 page faults per image say the
# system allocator is re-faulting nearly every byte it hands back. This tests
# whether an allocator that keeps pages mapped removes that cost, BEFORE any
# decision about shipping one.
mimalloc = { version = "0.1", default-features = false }
libmimalloc-sys = { version = "0.1", default-features = false }
# The pure-Rust remake of the above. Evaluating it is the whole point of
# `examples/alloc_ab.rs`: mimalloc is a C library, and it is also by a wide
# margin the largest single effect in the Diana latency campaign (1.64x), so
# it is simultaneously the dependency we most want to drop and the one that
# costs the most to drop wrongly.
rusty_alloc-api = "=0.3.2"
# The core, for `alloc::collect` — the reclaim `examples/scaling.rs` drives.
# `rusty_alloc-api` deliberately exposes collect only per-`Heap`.
rusty_alloc = "=0.3.2"
ffai-media = { workspace = true }
ffai-bench = { workspace = true }

[lints]
workspace = true

[features]
# DIAGNOSTIC, not a shipping default. Routes candle's matmul to Intel MKL.
#
# 52% of the pipeline is candle's GEMM running at ~50% of this box's peak, and
# beating it by hand is refuted four times. This answers the question that
# decides whether a pure-Rust GEMM effort is worth funding at all: if MKL
# closes the gap to ORT, the matmul IS the gap; if it does not, something else
# is, and a GEMM project would have been months spent on the wrong term.
#
# It is a C library, which is exactly what FFai exists not to depend on — so
# this is opt-in, off by default, and the number it produces is evidence about
# where to aim, not a result to ship.
mkl = ["candle-core/mkl", "candle-nn/mkl"]
# Emit per-decision telemetry for the Prometheus harvester (Stage 1).
# OFF by default and zero-cost when off: the hooks compile to empty bodies
# the optimizer deletes. Additive only — an instrumented engine must produce
# byte-identical output, which the oracle and determinism tests enforce.
prometheus-telemetry = []
# Allocator arms for `examples/alloc_ab.rs`. Selecting one changes exactly one
# type in one `#[global_allocator]` line and nothing else, so the two binaries
# are otherwise identical — which is what makes the A/B a measurement of the
# allocator rather than of two builds.
alloc-rusty = []
alloc-sys = []
