[package]
name = "ffai-carmenta"
description = "Carmenta — pure-Rust OCR: documents, screens, and a change-gated LIVE frame reader. Detection + recognition + computed reading order, engine-selectable."
# Decoupled from the workspace version, as Mercury is, so Carmenta can ship
# ahead of the rest. 0.7.0 rather than 0.6.2 because the default reading order
# changed: per-node routing (`pernode`) replaced the plain recursive cut and
# moves OmniDocBench holdout CER 24.77 % -> 20.27 %. The API is unchanged, but
# this crate's OUTPUT ORDER is what a caller consumes, so a different sequence
# for the same page is a compatibility break for anyone who pinned text.
# The previous behaviour stays reachable at run time via `FFAI_ORDER=xycut`.
# Its dependencies stay at the published 0.6.1.
# 0.8.0: the document stack (§43–§52). Vertical-CJK column splitting is ON by
# default (changed text on vertical pages = the same compatibility rule as
# 0.7.0; disable with `FFAI_VSPLIT_ASPECT=0`). Adds the opt-in table/formula
# routing stage (`FFAI_ROUTE=1`: PP-DocLayout-S + SLANet-plus + PP-FormulaNet-S
# ports, absorption-capped) and the opt-in ordering selection v2
# (`FFAI_ORDER_SELECT=2`, banked +0.0035 ReadOrder at text-neutral on the
# official OmniDocBench evaluator). README re-measured on that evaluator.
# 0.9.0: two measured levers become DEFAULTS, so the shipped engine is the one
# the README's benchmark row describes rather than a flagless subset of it.
# (a) word-fragment merging (§53-§55): +0.0097 text AND +0.0044 order on all
# 1651 pages, both CIs excluding zero; page-gated, because merging everywhere
# instead costs -0.0213. `FFAI_WORD_MERGE=0` restores 0.8.x. (b) ordering
# selection v2 (§51-§52): +0.0035 ReadOrder, text neutral; `FFAI_ORDER_SELECT=1`
# restores 0.8.x. Both change output order/content, which this crate versions
# as a compatibility break. Inline-formula splicing is added but stays OFF:
# it wins text and loses reading order, and order is a non-regression gate.
version = "0.9.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["ocr", "text-recognition", "document-ai", "computer-vision", "pdf"]
categories = ["computer-vision", "multimedia::images", "science"]

[dependencies]
ffai-core = { workspace = true }
ffai-models = { path = "../ffai-models", version = "0.6.2", default-features = false }  # not `workspace = true`: cargo forbids overriding default-features on an inherited dep
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
png = { workspace = true }

# rayon is NOT a wasm dependency. `wasm32-unknown-unknown` has no threads to
# spawn, so `crate::par` supplies the identical serial iterators there and a
# call site that still reaches for a parallel one fails to COMPILE rather than
# panicking in someone's browser.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { workspace = true }
tokenizers = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# getrandom 0.3 needs its `wasm_js` FEATURE in addition to the
# `--cfg getrandom_backend` that .cargo/config.toml supplies; it errors if
# either half is missing. Arrives here through tokenizers -> ahash.
getrandom = { version = "0.3", features = ["wasm_js"] }
# The workspace uses `rusty-expressions` everywhere now -- Oniguruma remade in
# pure Rust -- so wasm32 no longer needs a DIFFERENT engine from native, only
# the getrandom plumbing that the `wasm` feature carries.
tokenizers = { version = "0.23", default-features = false, features = ["rusty-expressions", "wasm"] }

[dev-dependencies]
# Examples only, never the library. `ffai-cli` sets mimalloc as its global
# allocator (see its main.rs); a global allocator is a link-time choice, so a
# measurement example must set it too or it measures a program that does not
# ship (§8.104). The library itself imposes nothing on its consumers.
mimalloc = { version = "0.1", default-features = false }
# Superseded as the default by the pure-Rust remake; see the allocator
# doc comment in `ffai-cli/src/main.rs` for the measurement.
rusty_alloc-api = "=1.1.4"
ffai-media = { workspace = true }
ffai-bench = { workspace = true }

# Weight downloading, ON by default so `CraftCrnn::new()` keeps fetching on
# first use, exactly as the README documents.
#
# Turning it OFF is what a security-conscious embedder wants, and it is what
# makes a wasm build possible at all: `fetch` pulls hf-hub, whose 1.0 release
# calls `reqwest::blocking` — a module that does not exist on wasm32, for 24
# compile errors before any of our code is reached. Mercury and Diana have had
# this opt-out for a while; Carmenta was the last engine without it, and until
# now shipped the HTTP/TLS stack with no way to remove it.
[features]
default = ["fetch"]
fetch = ["ffai-models/fetch"]
# Send wasm's 3x3 convolutions to candle instead of our SIMD128 kernel.
#
# wasm has no environment and validates its SIMD ahead of time, so the conv arm
# cannot be switched at run time the way `FFAI_CONV3X3` switches it natively —
# the two arms are two BUILDS, and this feature is the second one. It exists so
# the A/B in docs/plans/carmenta-wasm-plan.md stays reproducible; the default
# (off) is the arm that measured faster.
wasm-candle-conv = []

[lints.rust]
# Mirrors [workspace.lints.rust]; restated because this crate needs its own
# [lints.clippy] table, and `[lints] workspace = true` is all-or-nothing.
unsafe_code = "warn"

# Gate H-15: pedantic + nursery, enforced.
#
# !!! DEFERRED WORK, NOT A CLEAN BILL OF HEALTH !!!
#
# The three cast lints below are allowed WHOLESALE, which is NOT how the other
# ten crates were done. There, every truncation/sign-loss/wrap cast on an
# untrusted path was read individually and allowed only with a named guard, and
# that review found six real defects - an ONNX field-number aliasing bug, a WAV
# shift by an unvalidated header field, three unchecked frame allocations, and a
# zero-sample-rate divide that saturated into Vec::with_capacity(usize::MAX).
#
# This crate has ~149 such casts, and it parses IMAGES and DOCUMENTS - i.e.
# genuinely untrusted bytes, the same surface those defects were found on. That
# review is DEFERRED at the user's instruction (2026-08-15), not completed.
#
# So: the stylistic hygiene is done and the gate is on, but treat these three
# allows as an open TODO carrying real risk, not as a verdict. Removing them and
# working the list is the next piece of security work on this crate.
# Tracked in the audit memo and in ffai-mercury's plan file.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# --- DEFERRED: unreviewed casts on an untrusted-input path (see above) ---
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
# Rounding only; cannot alias one value onto another.
cast_precision_loss = "allow"
# --- documentation debt: revisit 2026-11-15 ---
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_long_first_doc_paragraph = "allow"
# --- style in vision/DSP code ---
suboptimal_flops = "allow"
many_single_char_names = "allow"
similar_names = "allow"
items_after_statements = "allow"
too_many_lines = "allow"
needless_pass_by_value = "allow"
needless_range_loop = "allow"
option_if_let_else = "allow"
single_match_else = "allow"
unnested_or_patterns = "allow"
equatable_if_let = "allow"
manual_let_else = "allow"
default_trait_access = "allow"
missing_const_for_fn = "allow"
unnecessary_wraps = "allow"
format_push_string = "allow"
significant_drop_tightening = "allow"
redundant_closure_for_method_calls = "allow"
struct_field_names = "allow"
struct_excessive_bools = "allow"
if_not_else = "allow"
match_same_arms = "allow"
unreadable_literal = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
float_cmp = "allow"
cast_ptr_alignment = "allow"
ref_as_ptr = "allow"
ptr_as_ptr = "allow"
borrow_as_ptr = "allow"
inline_always = "allow"
unused_self = "allow"
redundant_clone = "allow"
or_fun_call = "allow"
manual_midpoint = "allow"
format_collect = "allow"
derive_partial_eq_without_eq = "allow"
literal_string_with_formatting_args = "allow"
assigning_clones = "allow"
needless_continue = "allow"
needless_for_each = "allow"
while_float = "allow"
nonminimal_bool = "allow"
needless_collect = "allow"
imprecise_flops = "allow"
