# Head order: index 0 is the implicit CTC blank, lines 1..18384 are these
# entries — PaddleOCR's label list is [blank] + dict + [space]. The prepare tool
# READS THE FILE BACK and refuses unless it holds 18,384 entries ending in a
# space: an earlier edit meant to append that space silently did not apply, and
# an off-by-one here shifts every decoded character (§8.113's failure mode, in a
# form that only shows up as subtly wrong text).
