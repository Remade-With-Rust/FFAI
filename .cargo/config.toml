# getrandom 0.3 refuses `wasm32-unknown-unknown` unless the backend is named at
# BUILD time — the `wasm_js` feature alone is explicitly insufficient, and the
# crate says so in its own error. It has to be a rustflag rather than a feature
# because the choice is a property of the host environment (a browser with
# `crypto.getRandomValues`), not of any crate in the graph.
#
# Scoped to the wasm target so native builds are untouched.
[target.wasm32-unknown-unknown]
rustflags = [
    '--cfg', 'getrandom_backend="wasm_js"',
    # SIMD128. Measured 1.32-1.40x on Mercury (Whisper tiny.en, interleaved
    # ABBA, n=12 per arm, byte-identical transcript) — the win is LLVM
    # auto-vectorising candle's scalar loops, which this flag is the only way to
    # reach. gemm's own microkernels were already vectorised without it: they
    # carry `#[target_feature(enable = "simd128")]` per function.
    #
    # Needs the `[patch.crates-io]` candle fork in the root manifest; stock
    # candle-core 0.11.0 does not compile under this flag at all.
    #
    # **This makes SIMD a BASELINE REQUIREMENT of every wasm module we ship**,
    # not a runtime upgrade: wasm validates a whole module ahead of time, so one
    # v128 instruction anywhere means the module needs SIMD support, and there
    # is no `is_wasm_feature_detected!`. Every browser has shipped it since
    # Safari 16.4 (March 2023). A non-SIMD fallback would have to be a second
    # module, not a second branch.
    '-C', 'target-feature=+simd128',
]

# ---- binary hardening (gate H-04) --------------------------------------------
#
# Deliberately TARGET-SCOPED rather than set in [build]. A blanket `[build] rustflags`
# would override the wasm section above (cargo picks one rustflags source, it does not
# merge them), and the GNU linker arguments below are meaningless to MSVC and to
# Apple's linker - passing them there breaks the build outright.
#
# Windows (MSVC): ASLR/DEP/SEH hardening is on by default in the MSVC linker; there is
# nothing to add here, which is why there is no msvc block.
# macOS: PIE and NX are the default for Mach-O executables.

[target.'cfg(all(target_os = "linux", target_env = "gnu"))']
rustflags = [
    # Full RELRO: relocations read-only and bound eagerly, so GOT overwrite is not a
    # path to control flow.
    "-C", "link-arg=-Wl,-z,relro",
    "-C", "link-arg=-Wl,-z,now",
    # Non-executable stack.
    "-C", "link-arg=-Wl,-z,noexecstack",
    # Frame pointers: usable backtraces and profiles from release binaries, which is
    # what makes a crash report actionable. Costs one register.
    "-C", "force-frame-pointers=yes",
]
