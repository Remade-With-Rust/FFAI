# cargo-audit's ignores. deny.toml carries the same advisories with the full
# justification; keep the two lists in step (CI runs both).
[advisories]
ignore = [
    # zip 8.6.0 extraction advisories, fixed only in zip 9, which candle-core
    # 0.11 cannot take (it pins ^8.6). All three are in ZipArchive::extract /
    # ZipStreamReader::extract; candle reads entries by name and never extracts.
    # Added 2026-10-31. Review 2026-11-15, or when candle moves to zip 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # A fourth, same scope: extract() aborts on a symlink entry with a huge
    # declared size. candle never calls extract. Added 2026-11-08.
    "RUSTSEC-2026-0429",
]
