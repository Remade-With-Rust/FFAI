# Multi-speaker audio with an EXACT ground truth.
#
# Assembled from LibriSpeech clips whose speaker ids are known, so the
# RTTM is exact by construction rather than annotated. That is how a
# diarization gate gets bootstrapped without a licence-encumbered
# conversational corpus.
#
# Every speaker takes at least two turns, so a system must RE-IDENTIFY
# a returning voice rather than merely cut on silence. Cutting on
# silence alone scores badly here, which is the point.
#
# LIMITS, stated here rather than discovered later: speakers never
# overlap, turns are clean cuts rather than natural interruptions, and
# the audio is studio-quality read speech with 0.4s of digital silence
# between turns. A system can score well here and badly on a real
# meeting. This gates REGRESSION, not READINESS.
#
# Rebuild with
#   cargo run --release -p ffai-bench --example prepare_phase_e

name = "librispeech-diarization"
version = 1
task = "asr"

# 2 speakers, 33.4s
[[clips]]
id = "conv-01"
path = "clips/librispeech-diarization/audio/conv-01.wav"
ground_truth = "clips/librispeech-diarization/truth/conv-01.rttm"
class = "clean_speech"
split = "holdout"
license = "CC-BY-4.0"
sha256 = "449548cf7adce95701e3469eada1413119c30c03f212c21f6c8b2e5976ca121b"

