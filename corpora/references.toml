# ---- The TTS round-trip judge: a FROZEN third-party ASR, never ours ----
# Every implementation's audio (piper's and, later, piper-candle's) is
# resampled to 16 kHz mono by the harness and transcribed by THIS judge; WER
# between input text and transcript is the quality metric. base.en at beam 5
# rather than tiny.en/greedy: the judge's own error floor is shared noise on
# both sides, and a lower floor leaves more resolution for the comparison.
# Exactly one tts-judge may be declared (two judges = two error floors in one
# table). Never a Mercury engine — no self-grading.
# Model: .whispercpp/ggml-base.en.bin,
# sha256 a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002.
[[reference]]
name = "tts-judge-whisper-cpp-base"
task = "tts-judge"
config = "base.en/beam5/judge"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/whisper_cpp_ref.py", "--batch", "{filelist}", "--bin", ".whispercpp/whisper-cli.exe", "--model", ".whispercpp/ggml-base.en.bin", "--threads", "24", "--beam-size", "5"]
version_command = [".whispercpp/whisper-cli.exe", "--version"]
