# World-standard reference implementations `ffai bench` compares against.
#
# ASR references use BATCH mode: the adapter is invoked once for the whole
# corpus with a {filelist}, and reports per-clip transcription time itself, so
# interpreter startup and model load don't land inside every timed run. See
# crates/ffai-bench/src/reference.rs for why that matters, and
# corpora/refs/*.py for the adapters.
#
# DECODE CONFIG IS PINNED EXPLICITLY. Implementations ship different defaults
# — openai-whisper decodes greedily by default, faster-whisper uses
# beam_size=5 — and benchmarking one against the other unpinned compares
# decoding strategies while pretending to compare implementations. Every ASR
# reference below is pinned to beam_size=5 on the .en model of its size.
#
# Paths assume the bench venv from docs/benchmarking.md:
#   python -m venv .venv-bench
#   .venv-bench/Scripts/pip install faster-whisper openai-whisper
# Adjust the interpreter path for your platform (Scripts/ -> bin/ on unix).

# ---- openai-whisper (Python/PyTorch): the accuracy definition ----
[[reference]]
name = "openai-whisper-tiny"
task = "asr"
config = "tiny.en/beam5"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/openai_whisper_ref.py", "--batch", "{filelist}", "--model", "tiny.en", "--beam-size", "5"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import importlib.metadata as m; print('openai-whisper', m.version('openai-whisper'))"]

[[reference]]
name = "openai-whisper-base"
task = "asr"
config = "base.en/beam5"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/openai_whisper_ref.py", "--batch", "{filelist}", "--model", "base.en", "--beam-size", "5"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import importlib.metadata as m; print('openai-whisper', m.version('openai-whisper'))"]

# ---- faster-whisper (Python + CTranslate2/C++): the speed bar in production ----
[[reference]]
name = "faster-whisper-tiny"
task = "asr"
config = "tiny.en/beam5"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/faster_whisper_ref.py", "--batch", "{filelist}", "--model", "tiny.en", "--beam-size", "5", "--compute-type", "int8"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import faster_whisper; print('faster-whisper', faster_whisper.__version__)"]

[[reference]]
name = "faster-whisper-base"
task = "asr"
config = "base.en/beam5"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/faster_whisper_ref.py", "--batch", "{filelist}", "--model", "base.en", "--beam-size", "5", "--compute-type", "int8"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import faster_whisper; print('faster-whisper', faster_whisper.__version__)"]

# ---- GREEDY variants: the apples-to-apples bar for Mercury M1 ----
# whisper-candle decodes greedily until beam search lands in M2. Comparing a
# greedy engine against beam_size=5 references measures the decoding strategy,
# not the implementation — the same trap M0 caught between the two Python
# references. These rows are the honest M1 comparison; the beam rows above
# remain the M2 target.
[[reference]]
name = "openai-whisper-tiny-greedy"
task = "asr"
config = "tiny.en/greedy"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/openai_whisper_ref.py", "--batch", "{filelist}", "--model", "tiny.en", "--beam-size", "1"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import importlib.metadata as m; print('openai-whisper', m.version('openai-whisper'))"]

[[reference]]
name = "openai-whisper-base-greedy"
task = "asr"
config = "base.en/greedy"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/openai_whisper_ref.py", "--batch", "{filelist}", "--model", "base.en", "--beam-size", "1"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import importlib.metadata as m; print('openai-whisper', m.version('openai-whisper'))"]

[[reference]]
name = "faster-whisper-tiny-greedy"
task = "asr"
config = "tiny.en/greedy"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/faster_whisper_ref.py", "--batch", "{filelist}", "--model", "tiny.en", "--beam-size", "1", "--compute-type", "int8"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import faster_whisper; print('faster-whisper', faster_whisper.__version__)"]

# ---- OCR (Carmenta M-C0): the three named performance competitors ----
# Configuration is pinned the same way beam_size is for ASR: tesseract's
# --psm/--oem change the work done, so they are explicit argv, and the whole
# argv lands in every ledger line. All three declare config = "en/printed"
# so the matched-tier quality gate can compare them as one field.
#
# tesseract: portable extraction at .tools-bench/tesseract (no admin install;
# see docs/benchmarking.md), eng.traineddata from tessdata_fast. Its adapter
# spawns one process per image — the spawn tax is inside its per-page times,
# stated in corpora/refs/tesseract_ref.py rather than discovered later.
# DECISION (2026-07-30, user directive): tesseract is dropped from the
# MATCHED quality comparison — its 0.00% on synthetic clean print is real
# (five independent runs; the render corpus's recorded ceiling effect) but
# it makes the parity band degenerate, and Paddle is the accuracy bar that
# matters for a neural stack. The config key below no longer matches the
# engine's, so tesseract scores as open-field context only. It remains in
# LIVE benches as the per-frame C++ latency line (paddle-mobile's mkldnn
# handicap makes it a weak latency bar).
[[reference]]
name = "tesseract"
task = "ocr"
config = "en/legacy-cpp"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/tesseract_ref.py", "--batch", "{filelist}", "--bin", ".tools-bench/tesseract/tesseract.exe", "--tessdata", ".tools-bench/tesseract/tessdata", "--lang", "eng", "--psm", "3", "--oem", "1"]
version_command = [".tools-bench/tesseract/tesseract.exe", "--version"]

[[reference]]
name = "easyocr"
task = "ocr"
config = "en/printed"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/easyocr_ref.py", "--batch", "{filelist}", "--lang", "en"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import easyocr; print('easyocr', easyocr.__version__)"]

# paddleocr: pinned to the PP-OCRv5 MOBILE tier — the per-frame LIVE
# competitor (server tier is ~10x slower and belongs to the DOCUMENT
# comparison once a box with working oneDNN exists). --mkldnn off is a
# measured constraint of paddlepaddle 3.3.1 on this machine, not a choice —
# see the note in corpora/refs/paddleocr_ref.py. It handicaps Paddle's CPU
# speed; read its speed rows with that attached.
[[reference]]
name = "paddleocr-mobile"
task = "ocr"
config = "en/printed"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/paddleocr_ref.py", "--batch", "{filelist}", "--lang", "en", "--det-model", "PP-OCRv5_mobile_det", "--rec-model", "PP-OCRv5_mobile_rec", "--mkldnn", "off"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import paddleocr; print('paddleocr', paddleocr.__version__)"]

# PP-StructureV3 — the DOCUMENT-tier bar (M-C3's named reference).
#
# The line-level references answer "did you read the characters". This one
# answers whether they came out IN READING ORDER, having first decided the page
# has two columns, a running header and a footer that is not prose. Its output
# is taken from `parsing_res_list`, which is already ordered — the adapter
# never re-sorts boxes itself, because doing so would quietly turn a
# document-tier comparison back into a line-level one.
#
# Matched tier and matched handicaps with `paddleocr-mobile`: same mobile
# det+rec pair, oneDNN off (the §7.1 PIR crash), and doc-orientation /
# unwarping / textline-orientation / table / formula / seal stages all
# disabled, so the compared work is layout + read and nothing else. Slow —
# ~170 s per page on this box — which is a fact about the reference, recorded
# rather than hidden.
[[references]]
name = "ppstructure-v3"
task = "ocr"
config = "en/printed"
batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/ppstructure_ref.py", "--batch", "{filelist}", "--lang", "en", "--mkldnn", "off"]
version_command = [".venv-bench/Scripts/python.exe", "-c", "import paddleocr; print('pp-structurev3 (paddleocr)', paddleocr.__version__)"]

# Unlimited-OCR (Baidu, MIT, released 2026-06-22) — best-in-class document OCR.
#
# A 3B Mixture-of-Experts VLM (~500M active) continue-trained from DeepSeek-OCR,
# whose Reference Sliding Window Attention keeps the KV cache flat across a
# whole document. Holds the OmniDocBench v1.5/v1.6 record.
#
# CROSS-TIER, and the ledger must read it that way. Every other OCR reference
# here is a conventional detector+recogniser on CPU; this is a 3B generative
# model on an RTX 4060. Against Carmenta's 4.7 MB detector the QUALITY
# comparison is the interesting one and the speed/footprint comparison is not
# apples-to-apples in either direction — same class of caveat as tesseract's
# spawn tax and paddle's forced mkldnn-off, one tier up.
#
# Runs in its OWN venv: .venv-bench pins a CPU-only torch that EasyOCR's
# reference depends on, and upgrading it in place to get CUDA would put every
# existing OCR comparison at risk to add one new one.
[[references]]
name = "unlimited-ocr"
task = "ocr"
config = "en/printed"
batch_command = [".venv-unlimited/Scripts/python.exe", "corpora/refs/unlimited_ocr_ref.py", "--batch", "{filelist}"]
version_command = [".venv-unlimited/Scripts/python.exe", "-c", "import torch; print('baidu/Unlimited-OCR 3B on torch', torch.__version__)"]

# ---- Detection (Diana M-D0): official Ultralytics + the ORT CPU export ----
# Two stacks x two tiers, all pinned to the COCO-eval decode settings (conf
# 0.001, max-dets 100, imgsz 640, natively end-to-end — no NMS knob to pin
# because YOLO26 has none). config encodes model tier + input geometry so
# the matched-tier gate compares n against n and s against s; the
# ultralytics and ORT rows of one tier share a config on purpose — same
# weights, same decode, different runtime, exactly the tiny.en agreement
# check from Mercury M0. Weights: corpora/cache/yolo26{n,s}.pt, fetched
# ungated from github.com/ultralytics/assets (AGPL-3.0 — never vendored,
# never redistributed; see docs/diana-mission-plan.md §7.1). ONNX exports
# regenerated by tools/diana_export_onnx.py.
#
# --rect IS THIS VERTICAL'S beam_size. Ultralytics' predict() defaults
# rect=True, letterboxing each image to the smallest multiple-of-32
# RECTANGLE (a 586x640 image is fed as 640x608); the ONNX export is fixed
# 640x640 square. Unpinned, the .pt and ORT rows of one tier ran different
# input geometry and disagreed 1.5-1.8 pp in inconsistent directions
# (measured, M-D0 — the same defect class as the unpinned beam_size that
# made faster-whisper look slower in Mercury M0). The MATCHED rows below
# pin --rect off on both sides; the official rectangular default is kept as
# its own declared variant with its own config key, so it is on the board
# without polluting the matched band.
[[reference]]
name = "ultralytics-yolo26n"
task = "detect"
config = "yolo26n/e2e-640sq"
batch_command = [".venv-diana/Scripts/python.exe", "corpora/refs/ultralytics_ref.py", "--batch", "{filelist}", "--model", "corpora/cache/yolo26n.pt", "--imgsz", "640", "--conf", "0.001", "--max-dets", "100", "--rect", "off"]
version_command = [".venv-diana/Scripts/python.exe", "-c", "import ultralytics; print('ultralytics', ultralytics.__version__)"]

[[reference]]
name = "ultralytics-yolo26s"
task = "detect"
config = "yolo26s/e2e-640sq"
batch_command = [".venv-diana/Scripts/python.exe", "corpora/refs/ultralytics_ref.py", "--batch", "{filelist}", "--model", "corpora/cache/yolo26s.pt", "--imgsz", "640", "--conf", "0.001", "--max-dets", "100", "--rect", "off"]
version_command = [".venv-diana/Scripts/python.exe", "-c", "import ultralytics; print('ultralytics', ultralytics.__version__)"]

# The official default geometry, on the board as its own configuration.
[[reference]]
name = "ultralytics-yolo26n-rect"
task = "detect"
config = "yolo26n/e2e-640rect"
# Matched by `yolo26n`, our DEFAULT engine — rectangular letterboxing, the
# same choice Ultralytics makes, and better on both axes at this tier.
batch_command = [".venv-diana/Scripts/python.exe", "corpora/refs/ultralytics_ref.py", "--batch", "{filelist}", "--model", "corpora/cache/yolo26n.pt", "--imgsz", "640", "--conf", "0.001", "--max-dets", "100", "--rect", "on"]
version_command = [".venv-diana/Scripts/python.exe", "-c", "import ultralytics; print('ultralytics', ultralytics.__version__)"]

[[reference]]
