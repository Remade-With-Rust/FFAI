batch_command = [".venv-diana/Scripts/python.exe", "corpora/refs/ultralytics_ref.py", "--batch", "{filelist}", "--model", "corpora/cache/yolo26s.pt", "--imgsz", "640", "--conf", "0.001", "--max-dets", "100", "--rect", "on"]
