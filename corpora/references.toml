batch_command = [".venv-bench/Scripts/python.exe", "corpora/refs/whisper_cpp_ref.py", "--batch", "{filelist}", "--bin", ".whispercpp/whisper-cli.exe", "--model", ".whispercpp/ggml-small.en.bin", "--threads", "24", "--beam-size", "1"]
version_command = [".whispercpp/whisper-cli.exe", "--version"]

