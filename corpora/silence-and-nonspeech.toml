# Audio containing NO WORDS. Ground truth is the empty string, so any
# token an engine emits here is an error.
#
# This corpus exists because every other corpus in the project is
# continuous clean read speech, and that blind spot shipped two real
# defects: Whisper hallucinating "you" on silence, and a cough coming
# out as "Hah!". Both were found by a browser demo in ten seconds of
# microphone audio after 268 pinned clips saw neither.
#
# Synthesised deterministically by
#   cargo run --release -p ffai-bench --example prepare_phase_e
# so the hashes are reproducible. Synthetic audio is banned from a
# QUALITY verdict (see codec-tune-quality); it is entirely valid for a
# CORRECTNESS one, which is what this measures: did the engine invent
# words that were never spoken.

name = "silence-and-nonspeech"
version = 1
task = "asr"

[[clips]]
id = "digital-silence-5s"
path = "clips/silence-and-nonspeech/audio/digital-silence-5s.wav"
ground_truth = "clips/silence-and-nonspeech/truth/digital-silence-5s.txt"
class = "other"
split = "holdout"
license = "CC0-1.0"
sha256 = "262d1f34f300560a4c82ba8127ddea9e1d72946f187fdbd3e8f70ee096077aec"

