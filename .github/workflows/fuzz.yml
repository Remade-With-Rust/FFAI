# Continuous fuzzing (gate H-27).
#
# Coverage-guided fuzzing only counts if it keeps running, so this is a SCHEDULE,
# not a PR gate: a nightly budget per target, with the corpus carried between runs
# so coverage accumulates instead of restarting from the seeds every night.
#
# LINUX ONLY, and that is a finding rather than a preference. `cargo fuzz` cannot
# build these targets on Windows/MSVC: `onig_sys` - the C regex library `tokenizers`
# pulls for its `onig` feature - fails to compile under the fuzzer's sanitizer
# flags. `tokenizers` offers a pure-Rust `fancy-regex` alternative, which would
# remove that C dependency and unblock local fuzzing; it is NOT swapped here
# because the tokenizer oracle skips without cached whisper weights, so the change
# would be unverified on the ASR correctness path.

# THE BUDGET, AND WHAT "30 DAYS" IS WORTH IN COMPUTE
#
# H-27 asks for ">=30 days of coverage-guided fuzzing (or equivalent)". This job
# is what defines that number, so the arithmetic belongs here rather than in
# whoever's head:
#
#     10 minutes  x  4 targets  x  30 nights  =  1,200 target-minutes
#                                             =  20 core-hours
#
# So "30 days" of THIS schedule is 20 core-hours of libFuzzer. A machine with
# cores to spare can deliver the same compute in an afternoon, and the criterion's
# "(or equivalent)" is what permits that.
#
# It is NOT the same thing in every respect, and the audit row says so: 30 nights
# also fuzz 30 successive revisions of the code, which concentrated compute cannot
# reproduce. Equivalent compute is a floor on effort, not a substitute for
# continuous coverage - which is why this schedule stays on.
#
# Raise `minutes` via workflow_dispatch to buy more; the corpus cache means the
# extra time compounds instead of restarting.

name: Fuzz

on:
  schedule:
    - cron: "0 3 * * *"      # nightly, off the hardening gate's Monday slot
  workflow_dispatch:
    inputs:
      minutes:
        description: "Minutes per target"
        type: string
        default: "10"

permissions:
  contents: read

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false        # one target crashing must not hide the others
      matrix:
        target: [mel_compute, normalize_text, onnx_parse, lexicon_parse]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-fuzz --locked

      # Restore the accumulated corpus. Without this every run starts from the
      # seeds and re-derives the same shallow coverage forever - which looks like
      # fuzzing and is not.
      - name: Restore corpus
        uses: actions/cache/restore@v6
        with:
          path: crates/ffai-mercury/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: Fuzz
        working-directory: crates/ffai-mercury
        run: |
          MINUTES="${{ inputs.minutes || '10' }}"
          cargo +nightly fuzz run ${{ matrix.target }} -- \
            -max_total_time=$((MINUTES * 60)) -print_final_stats=1

      - name: Save corpus
        if: always()
        uses: actions/cache/save@v6
        with:
          path: crates/ffai-mercury/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}

      # A crash is the product. Keep it even though the job failed - especially
      # then - so it can become a regression seed.
      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: |
            crates/ffai-mercury/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

  # Sanitizers (gate H-24). Nightly, not per-PR: `-Zbuild-std` rebuilds the whole
  # standard library under instrumentation, which is minutes of work that would
  # dominate a PR gate for a check that has never yet found a regression.
  #
  # TSan is the one that earns its keep here. It exercises both Class B unsafe
  # sites - the rayon `SendPtr` sharing in tts::decoder_kernels and the strided
  # heads in asr::flash_attn - which is exactly the claim R-002 says is argued in
  # a comment rather than proven. Kani proves the addressing arithmetic; TSan
  # watches the real threads. Neither alone is enough.
  #
  # MSan is deliberately absent: it needs every dependency instrumented including
  # C/C++, and this graph carries onig_sys, aws-lc-sys and BLAS-family code that
  # is not. An uninstrumented MSan run yields false positives, not findings.
  sanitizers:
    name: Sanitizers (TSan + ASan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: rust-src }
      - uses: Swatinem/rust-cache@v2
      - name: ThreadSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: halt_on_error=1
        run: cargo +nightly test -p ffai-mercury --lib -Zbuild-std --target x86_64-unknown-linux-gnu
      - name: AddressSanitizer
        env:
          RUSTFLAGS: -Zsanitizer=address
          # Leak detection is a different gate; this job is about memory errors.
          ASAN_OPTIONS: detect_leaks=0
        run: cargo +nightly test -p ffai-mercury --lib -Zbuild-std --target x86_64-unknown-linux-gnu
