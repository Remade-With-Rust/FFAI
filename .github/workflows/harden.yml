# The hardening gate. Gates H-37 (runs on every PR), H-06 (the tool set exists and is
# pinned), H-22 (analysis beyond the default linter), C-12 (changes are traceable).
#
# Action versions are pinned to a major tag and the token is read-only by default:
# a workflow that can write to the repo is a supply-chain target in its own right.

name: Hardening gate

on:
  push:
    branches: [master, main]
  pull_request:
  schedule:
    # Advisories land between commits; a weekly run catches them without a push (H-40).
    - cron: "0 6 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # NOTE: no global `RUSTFLAGS: -D warnings`. It would apply to the test job too, and the
  # workspace deliberately sets `unsafe_code = "warn"` as an INVENTORY signal (tracked in
  # each crate's UNSAFE.md) rather than as a build failure. Denying warnings globally
  # would turn that signal into a broken build.

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      # BLOCKING for ffai-mercury: that crate is now rustfmt-clean, so a
      # regression there fails the build.
      - name: Format (blocking - clean crates)
        run: cargo fmt -p ffai-mercury -p ffai-media --check

      # ADVISORY for the rest: ~1500 pre-existing rustfmt diffs across the other
      # crates. Blocking today would make the gate red on arrival, which teaches
      # people to ignore CI.
      # TO FLIP a crate: `cargo fmt -p <crate>` in a single mechanical commit when
      # no other work is in flight, then move it into the blocking step above.
      - name: Format (advisory - workspace)
        continue-on-error: true
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      # BLOCKING for ffai-mercury: its lib is clippy-clean (267 findings -> 0), so
      # a regression there fails the build. This is the incremental-adoption
      # pattern - a crate becomes blocking the moment it is clean, instead of
      # waiting for the whole workspace.
      # `-A unsafe_code` is permanent and deliberate: that lint is an INVENTORY
      # signal, and UNSAFE.md plus tools/lint_invariants.py are what enforce it.
      # BLOCKING for every crate that is clean. A crate joins this list the moment
      # it reaches zero, rather than waiting for the whole workspace - which is
      # how the debt shrinks without CI ever being red.
      # PEDANTIC + NURSERY tier (enforced by their own manifests, so -D warnings
      # promotes them): ffai-core, ffai-argus, ffai-models.
      # clippy::all tier: ffai-media, ffai-bench, ffai-mercury.
      # Remaining: ffai-diana 30, ffai-carmenta 34, ffai-cli 64 (binary-only).
      # Pedantic debt in the clippy::all tier: media 65, bench 253, mercury 757.
      - name: Clippy (blocking - clean crates)
        run: |
          cargo clippy -p ffai-core -p ffai-models -p ffai-media -p ffai-argus                        -p ffai-mercury -p ffai-bench --lib -- -D warnings -A unsafe_code

      # ADVISORY for the rest: other crates still carry pre-existing findings.
      # TO FLIP: clear a crate, move it into the blocking step above. 2026-09-30.
      - name: Clippy (advisory - workspace)
        continue-on-error: true
        run: cargo clippy --workspace --all-targets -- -D warnings -A unsafe_code

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Compile EVERY target, not just the libs. Two examples had rotted against
      # a `BenchConfig` field added to ffai-bench - `cargo test --lib` never
      # compiles an example, so nothing noticed until cargo-mutants tried to
      # build the tree. An example that does not compile is dead documentation.
      - run: cargo check --workspace --all-targets
      # Lib + integration tests. Model-dependent tests skip when fixtures are absent.
      - run: cargo test --workspace --lib

  supply-chain:
    name: Supply chain (deny + audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - name: cargo-audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      # cargo-vet is a RATCHET, not a score. The 474 exemptions record the tree as
      # it stood when vetting was introduced; what this step enforces is that a
      # NEW dependency cannot arrive without either an imported audit covering it
      # or an explicit, reviewed exemption. That is the property worth having on
      # every PR - the burn-down is a separate, slower programme.
      - name: cargo-vet
        run: |
          cargo install cargo-vet --locked
          cargo vet check

  miri:
    name: Miri (UB interpreter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with: { components: miri }
      - uses: Swatinem/rust-cache@v2
      # Scoped to tests/miri_safe.rs on purpose, and BLOCKING because that scope
      # is verified green. Miri interprets Rust: it cannot run x86 SIMD
      # intrinsics (rustfft, reached via mel::compute) or foreign functions (the
      # Win32 memory instrumentation). Pointing it at --lib or tests/properties.rs
      # fails for those reasons and not because the code is wrong, which is
      # exactly the sort of red CI that teaches people to ignore CI.
      # TO WIDEN: move a test into miri_safe.rs once it avoids SIMD and FFI.
      - run: cargo miri test -p ffai-mercury --test miri_safe
        env:
          MIRIFLAGS: -Zmiri-strict-provenance

  kani:
    name: Kani (bounded proofs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked kani-verifier && cargo kani setup
      # ADVISORY on arrival: the harnesses in crates/ffai-mercury/src/proofs.rs are
      # written and compile, but Kani does not run on Windows so they have never
      # been executed. The first green run on this runner is what flips this to
      # blocking - claiming a proof nobody has run is worse than no proof.
      # TO FLIP: delete continue-on-error once this passes. Target 2026-09-30.
      - name: Verify
        continue-on-error: true
        run: cargo kani -p ffai-mercury

  invariants:
    name: Project invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      # Clippy checks Rust; this checks FFai. Every rule exists because an audit
      # found the thing it prevents - see tools/lint_invariants.py --list.
      - run: python tools/lint_invariants.py

  hardening-tables:
    name: Hardening tables current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.x" }
      # The README blocks are GENERATED from each crate's plan file. This fails the build
      # when a plan file was edited without re-rendering, which is the only thing keeping
      # a published hardening claim honest.
      - run: python tools/render_hardening_table.py --all --root . --check
