[workspace]
resolver = "2"
members = ["crates/*"]
# The demo UI is a wasm app with its own lockfile and its own target dir.
# Inside the workspace it would be built for the host by `cargo build
# --workspace` and fail; excluded, `dx` owns it entirely.
exclude = ["demo-ui"]

[workspace.package]
version = "0.7.2"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/FFai"
authors = ["Remade With Rust"]

[workspace.dependencies]
# ---- internal crates ----
ffai-core = { path = "crates/ffai-core", version = "0.7.0" }
ffai-media = { path = "crates/ffai-media", version = "0.6.5" }
ffai-models = { path = "crates/ffai-models", version = "0.6.3" }
ffai-mercury = { path = "crates/ffai-mercury", version = "1.0.2" }
ffai-carmenta = { path = "crates/ffai-carmenta", version = "0.10.0" }
ffai-diana = { path = "crates/ffai-diana", version = "0.7.5" }
ffai-argus = { path = "crates/ffai-argus", version = "0.7.2" }
ffai-bench = { path = "crates/ffai-bench", version = "0.7.4" }

# ---- tensor spine ----
# Candle is FFai's PyTorch: every engine shares its Tensor/Device types so
# buffers move between models without copies or format conversions.
# All three MUST move in lockstep — mixing candle-core and candle-transformers
# across minor versions is a type mismatch, not a warning.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

# ---- model loading ----
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
rustfft = "6"
hf-hub = { version = "1", default-features = false, features = ["blocking", "rustls-tls"] }

# ---- ecosystem ----
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
dirs = "6"
sha2 = "0.10"
serde_json = "1"
regex = "1"
rayon = "1"
png = "0.17"

# ---- our own codecs (Principle 7), from crates.io ----
# Still-image decoding comes from home AND publishes. `rusty_png` is our
# performance fork of image-rs/image-png; `rusty_jpeg` is baseline +
# progressive DCT with AVX2 FDCT/quantize and a two-block AVX2 IDCT. Both
# are consumed by version, so nothing downstream inherits a git dependency.
rusty_png = "0.1"
rusty_jpeg = "0.1"

# ---- remade_ffmpeg_rs: the rest of our ffmpeg (Principle 7) ----
# STILL git, and the consequence is worth keeping written down rather than
# rediscovered: `cargo publish` refuses a git dependency outright —
#   "all dependencies must have a version requirement specified when publishing"
# — so any FFai crate that depends on these cannot publish until rff does.
#
# That used to bind `ffai-media`, and through it everything downstream. It
# no longer does: the still-image decoders moved to the standalone crates
# above and `cargo publish --dry-run -p ffai-media` passes. The constraint
# returns when VIDEO lands, because demuxers and H.264/VP9 are things rff
# provides that nothing else does — at which point the answer is to publish
# rff or vendor it, not to give up the stack.
rff-core = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs" }
rff-codec = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs" }
rff-codec-jpeg = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs" }
rff-codec-png = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs" }

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = "thin"
# NO `overflow-checks` here, and that is a DECISION, not an oversight.
#
# Hardening gate H-05 asks for it. It was measured on 2026-08-15 and costs
# 1.060x on the TTS pipeline and 1.094x on the decoder stage (n=22 paired,
# z=+4.26, null-arm floor 0.995 - see crates/ffai-mercury/docs/plans/
# use-protection-please.md). The gate's justification is that we parse
# attacker-controlled model files; we do not - model files come from a trusted
# source and the deployer owns the cache directory. With that threat retired,
# the 6% buys nothing and the gate is waived. The waiver is time-bounded and
# recorded in the plan file's Waivers table.
#
# If model files ever become untrusted - user-supplied voice packs, a shared
# cache, downloads without hash verification - this decision expires WITH them
# and overflow-checks goes back on.
codegen-units = 1

# ---- onig, removed from the native graph -------------------------------------
#
# `candle-core` declares `tokenizers` with `features = ["onig"]` under
# `cfg(not(target_arch = "wasm32"))`, and Cargo does not let a consumer strip a
# feature that a transitive dependency selected. So `onig_sys` — Oniguruma, a C
# regex engine — compiled into every native build. It is NOT dead weight: it
# backs `SysRegex`, which `ByteLevel` calls on every tokenization.
#
# These forks delete the optional `onig` dependency outright and re-point the
# `onig` FEATURE at `rusty_expressions`, our pure-Rust Oniguruma. candle's
# request is still satisfied by name, and nothing left in the graph can compile
# libonig.
#
# TWO entries because two incompatible versions are in the tree: candle pins
# ^0.22 and our own engines take ^0.23. Cargo allows that through a renamed key
# carrying an explicit `package`.
#
# NOTE: `[patch]` is NOT carried into published crates. This makes OUR builds
# onig-free; anyone depending on `ffai-argus` from crates.io still gets candle's
# onig until the change lands upstream in candle itself.
[patch.crates-io]
# candle-core 0.11.0 cannot be built with `-C target-feature=+simd128`: its
# `cpu/mod.rs` re-exports three types for avx and neon but only `CurrentCpu` for
# simd128, while four f16/bf16 helpers are gated on `any(neon, avx2, simd128)`
# and use the two that do not exist. Our branch removes simd128 from those four
# gates and their four matching scalar arms, so f16/bf16 fall back to scalar and
# f32 stays vectorised.
#
# That flag is worth 1.32-1.40x on Mercury (Whisper tiny.en, interleaved ABBA,
# n=12 per arm, byte-identical transcript), and it is set for wasm32 in
# `.cargo/config.toml`. Branched from the 0.11.0 TAG rather than main so the
# patched crate stays version-compatible with what the workspace requires.
#
# `[patch]` is global, so native builds resolve candle-core here too. That is
# behaviour-neutral: every line this branch changes sits behind a
# `target_feature = "simd128"` cfg, which is never active off wasm.
candle-core = { git = "https://github.com/Remade-With-Rust/candle", branch = "simd128-f16-gates-0.11.0" }
tokenizers = { git = "https://github.com/Remade-With-Rust/tokenizers", branch = "rusty-expressions-deploy" }
tokenizers-v022 = { git = "https://github.com/Remade-With-Rust/tokenizers", branch = "v0.22-rusty-expressions", package = "tokenizers" }
