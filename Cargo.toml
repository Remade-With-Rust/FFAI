[workspace]
resolver = "2"
members = ["crates/*"]
# The demo UI is a wasm app with its own lockfile and its own target dir.
# Inside the workspace it would be built for the host by `cargo build
# --workspace` and fail; excluded, `dx` owns it entirely.
exclude = ["demo-ui"]

[workspace.package]
version = "0.6.1"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Remade-With-Rust/FFai"
authors = ["Remade With Rust"]

[workspace.dependencies]
# ---- internal crates ----
ffai-core = { path = "crates/ffai-core", version = "0.6.1" }
ffai-media = { path = "crates/ffai-media", version = "0.6.1" }
ffai-models = { path = "crates/ffai-models", version = "0.6.1" }
ffai-mercury = { path = "crates/ffai-mercury", version = "0.7.0" }
ffai-carmenta = { path = "crates/ffai-carmenta", version = "0.6.1" }
ffai-diana = { path = "crates/ffai-diana", version = "0.6.1" }
ffai-argus = { path = "crates/ffai-argus", version = "0.6.1" }
ffai-bench = { path = "crates/ffai-bench", version = "0.6.1" }

# ---- tensor spine ----
# Candle is FFai's PyTorch: every engine shares its Tensor/Device types so
# buffers move between models without copies or format conversions.
# All three MUST move in lockstep — mixing candle-core and candle-transformers
# across minor versions is a type mismatch, not a warning.
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"

# ---- model loading ----
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }
rustfft = "6"
hf-hub = { version = "1", default-features = false, features = ["blocking", "rustls-tls"] }

# ---- ecosystem ----
thiserror = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
hound = "3"
dirs = "6"
sha2 = "0.10"
serde_json = "1"
regex = "1"
rayon = "1"
png = "0.17"

# ---- remade_ffmpeg_rs: our own pure-Rust ffmpeg (Principle 7) ----
# Codec work comes from home. These are git dependencies because rff is not
# on crates.io yet, and that has ONE consequence worth knowing rather than
# rediscovering: `cargo publish` refuses a git dependency outright —
#   "all dependencies must have a version requirement specified when publishing"
# — so any FFai crate in this dependency chain cannot be published until rff
# publishes. That is a deliberate trade: owning the stack over crates.io
# distribution, for a deployment that is Rust end to end.
rff-core = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs" }
rff-codec = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs" }
rff-codec-jpeg = { git = "https://github.com/Remade-With-Rust/remade_ffmpeg_rs" }

[workspace.lints.rust]
unsafe_code = "warn"

[profile.release]
lto = "thin"
